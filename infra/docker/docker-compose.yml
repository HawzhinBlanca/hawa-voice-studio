version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hawa-postgres
    environment:
      POSTGRES_USER: hawa_user
      POSTGRES_PASSWORD: hawa_password
      POSTGRES_DB: hawa_sorani_voice
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hawa_user -d hawa_sorani_voice"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    container_name: hawa-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://hawa_user:hawa_password@postgres:5432/hawa_sorani_voice
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: hawa-sorani-voice-assets
      TEMPORAL_HOST: temporal:7233
    ports:
      - "8000:8000"
    volumes:
      - ../../data/storage:/app/data/storage

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    container_name: hawa-web
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
