name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ==========================================
  # Python Backend CI
  # ==========================================
  backend-lint:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install ruff mypy pytest sqlalchemy aiosqlite pydantic pydantic-settings fastapi httpx
      - name: Ruff lint
        run: ruff check . --select E,W,F,I --ignore E501
      - name: Ruff format check
        run: ruff format --check .
      - name: mypy type check
        run: mypy packages/ services/api/ --ignore-missing-imports --no-error-summary || true

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install pytest sqlalchemy aiosqlite pydantic pydantic-settings fastapi httpx starlette
      - name: Run golden text normalizer tests
        run: PYTHONPATH=. pytest tests/golden-text/ -v
      - name: Run audio regression tests
        run: PYTHONPATH=. pytest tests/audio-regression/ -v
      - name: Run API endpoint tests
        run: PYTHONPATH=. pytest tests/api/ -v
      - name: Run E2E pipeline tests
        run: PYTHONPATH=. pytest tests/e2e/ -v

  # ==========================================
  # Frontend CI
  # ==========================================
  frontend-lint-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint || true
      - name: Production build
        run: npm run build

  # ==========================================
  # Database Migration Check
  # ==========================================
  migration-check:
    name: Database Migration Check
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install alembic sqlalchemy aiosqlite pydantic pydantic-settings
      - name: Verify Alembic config
        run: |
          if [ -f alembic.ini ]; then
            alembic check || true
          else
            echo "⚠️ No alembic.ini found — migrations not yet configured"
          fi

  # ==========================================
  # Docker Build Validation
  # ==========================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-lint-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build API Docker image
        run: docker build -f infra/docker/api.Dockerfile -t hawa-api:ci .
      - name: Build Web Docker image
        run: docker build -f infra/docker/web.Dockerfile -t hawa-web:ci .
