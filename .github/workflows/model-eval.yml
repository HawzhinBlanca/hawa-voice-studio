name: Model Evaluation Regression

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: 'Model version ID to evaluate'
        required: true
      test_suite:
        description: 'Test suite (core_sorani, production_text, expressive, long_form)'
        required: true
        default: 'core_sorani'

jobs:
  model-regression:
    name: Model Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pytest sqlalchemy aiosqlite pydantic pydantic-settings
      - name: Run 100-sentence Sorani regression
        run: |
          echo "Running regression against model: ${{ github.event.inputs.model_version }}"
          echo "Test suite: ${{ github.event.inputs.test_suite }}"
          PYTHONPATH=. python -c "
          from ml.evaluation.benchmark_runner import BenchmarkRunner
          runner = BenchmarkRunner()
          print('Benchmark runner initialized successfully')
          "
      - name: Watermark detection check
        run: |
          PYTHONPATH=. python -c "
          from packages.audio_processing import AudioSealWatermark
          print('AudioSeal watermark module loaded successfully')
          "
      - name: Latency smoke test
        run: |
          echo 'Latency gate: P95 TTFB < 500ms required for production'
